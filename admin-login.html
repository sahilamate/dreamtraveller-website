<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin CRM Login | Dream Travelkar Business Management System</title>
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,300;0,9..40,400;0,9..40,500;0,9..40,600;0,9..40,700;1,9..40,400&family=Playfair+Display:ital,wght@0,400;0,500;0,600;0,700;1,400;1,600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/4.7.0/css/font-awesome.min.css">
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/admin.css">
    <link rel="stylesheet" href="css/responsive.css">
    <link rel="shortcut icon" type="image/png" href="https://dreamtravelkar.co.in/images/logo.png">
</head>
<body style="background:var(--color-navy-dark); min-height:100vh; display:flex; flex-direction:column; justify-content:center; align-items:center; padding:30px 20px;">

    <div style="max-width:440px; width:100%; background:#ffffff; border-radius:var(--radius-lg); box-shadow:0 25px 60px rgba(0,0,0,0.4); border:1px solid rgba(255,255,255,0.1); overflow:hidden;">
        <!-- Header -->
        <div style="background:var(--color-navy); padding:32px 28px; text-align:center; color:#ffffff; border-bottom:3px solid var(--color-gold);">
            <div style="width:52px; height:52px; border-radius:var(--radius-md); background:linear-gradient(135deg, var(--color-gold), #dfcb9f); color:var(--color-navy-dark); display:flex; align-items:center; justify-content:center; font-size:1.6rem; font-weight:700; margin:0 auto 12px auto;">
                <i class="fa fa-shield"></i>
            </div>
            <h2 style="color:#ffffff; font-size:1.5rem; margin-bottom:4px;">Business Management Panel</h2>
            <p style="color:var(--color-sand); font-size:0.78rem; text-transform:uppercase; letter-spacing:0.12em; margin:0;">
                Dream Travelkar &bull; Worli, Mumbai
            </p>
        </div>

        <!-- Form Body -->
        <div style="padding:32px 28px;">
            <div style="background:#fef9c3; border:1px solid #fde047; border-radius:var(--radius-sm); padding:10px 14px; font-size:0.8rem; color:#854d0e; margin-bottom:20px;">
                <i class="fa fa-info-circle"></i> <strong>Demo Credentials:</strong><br>
                Username: <code>admin</code> | Password: <code>dream123</code>
            </div>

            <!-- Quick Demo Login Button -->
            <button type="button" id="btn-quick-admin-login" class="btn btn-gold" style="width:100%; margin-bottom:20px; padding:12px;">
                <i class="fa fa-bolt"></i> One-Click Admin Demo Login
            </button>

            <div style="display:flex; align-items:center; margin-bottom:20px;">
                <div style="flex-grow:1; height:1px; background:var(--color-border);"></div>
                <span style="padding:0 12px; font-size:0.75rem; text-transform:uppercase; color:var(--color-muted);">or authenticate</span>
                <div style="flex-grow:1; height:1px; background:var(--color-border);"></div>
            </div>

            <form id="admin-login-form">
                <div class="form-group">
                    <label class="form-label">Admin Username</label>
                    <input type="text" id="admin-user" class="form-control" value="admin" required>
                </div>
                <div class="form-group">
                    <label class="form-label">Password</label>
                    <input type="password" id="admin-pass" class="form-control" value="dream123" required>
                </div>

                <button type="submit" class="btn btn-primary" style="width:100%; padding:13px; margin-top:10px;">
                    <i class="fa fa-lock"></i> Access Admin CRM Dashboard
                </button>
            </form>

            <div style="margin-top:24px; text-align:center; font-size:0.82rem; color:var(--color-muted); border-top:1px solid var(--color-border-light); padding-top:16px;">
                <a href="customer-dashboard.html" style="color:var(--color-ocean); font-weight:500;">Switch to Customer Portal</a>
            </div>
        </div>
    </div>

    <div style="margin-top:20px; text-align:center; font-size:0.82rem; color:#94a3b8;">
        <a href="index.html" style="color:#ffffff;"><i class="fa fa-arrow-left"></i> Return to Dream Travelkar Public Site</a>
    </div>

    <script src="js/data.js"></script>
    <script src="js/storage.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', function () {
            const quickBtn = document.getElementById('btn-quick-admin-login');
            if (quickBtn) {
                quickBtn.addEventListener('click', function () {
                    StorageManager.setAdminLogged(true);
                    StorageManager.showToast('Admin Session Authorized.', 'success');
                    setTimeout(() => window.location.href = 'admin-dashboard.html', 400);
                });
            }

            const form = document.getElementById('admin-login-form');
            if (form) {
                form.addEventListener('submit', function (e) {
                    e.preventDefault();
                    const user = document.getElementById('admin-user').value.trim();
                    const pass = document.getElementById('admin-pass').value.trim();

                    if ((user === 'admin' || user === 'admin@dreamtravelkar.com') && (pass === 'dream123' || pass === 'admin')) {
                        StorageManager.setAdminLogged(true);
                        StorageManager.showToast('Admin login successful!', 'success');
                        setTimeout(() => window.location.href = 'admin-dashboard.html', 500);
                    } else {
                        StorageManager.showToast('Invalid credentials. Use demo: admin / dream123', 'error');
                    }
                });
            }
        });
    </script>
</body>
</html>
