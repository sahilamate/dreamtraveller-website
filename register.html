<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Customer Registration | Dream Travelkar</title>
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,300;0,9..40,400;0,9..40,500;0,9..40,600;0,9..40,700;1,9..40,400&family=Playfair+Display:ital,wght@0,400;0,500;0,600;0,700;1,400;1,600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/4.7.0/css/font-awesome.min.css">
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/responsive.css">
    <link rel="shortcut icon" type="image/png" href="https://dreamtravelkar.co.in/images/logo.png">
</head>
<body style="background:var(--color-sand-light); min-height:100vh; display:flex; flex-direction:column; justify-content:center; align-items:center; padding:30px 20px;">

    <div style="max-width:480px; width:100%; background:#ffffff; border-radius:var(--radius-lg); box-shadow:var(--shadow-lg); border:1px solid var(--color-border); overflow:hidden;">
        <!-- Header -->
        <div style="background:var(--color-navy); padding:30px 28px; text-align:center; color:#ffffff; border-bottom:3px solid var(--color-gold);">
            <a href="index.html">
                <img src="https://dreamtravelkar.co.in/images/logo.png" alt="Dream Travelkar" style="height:44px; margin:0 auto 10px auto;" onerror="this.style.display='none';">
            </a>
            <h2 style="color:#ffffff; font-size:1.5rem; margin-bottom:4px;">Create Customer Account</h2>
            <p style="color:var(--color-sand); font-size:0.8rem; text-transform:uppercase; letter-spacing:0.1em; margin:0;">
                Join Dream Travelkar for Exclusive Holiday Privileges
            </p>
        </div>

        <!-- Body Form -->
        <div style="padding:32px 28px;">
            <div style="background:#fef9c3; border:1px solid #fde047; border-radius:var(--radius-sm); padding:10px 12px; font-size:0.78rem; color:#854d0e; margin-bottom:20px;">
                <i class="fa fa-info-circle"></i> <strong>Demo Notice:</strong> Data entered here is stored in browser localStorage.
            </div>

            <form id="customer-register-form">
                <div class="form-group">
                    <label class="form-label">Full Name *</label>
                    <input type="text" id="reg-name" class="form-control" placeholder="e.g. Ramesh Kulkarni" required>
                </div>
                <div class="form-row-2col">
                    <div class="form-group">
                        <label class="form-label">Email Address *</label>
                        <input type="email" id="reg-email" class="form-control" placeholder="name@email.com" required>
                    </div>
                    <div class="form-group">
                        <label class="form-label">Phone Number *</label>
                        <input type="tel" id="reg-phone" class="form-control" placeholder="+91 98200 XXXXX" required>
                    </div>
                </div>
                <div class="form-row-2col">
                    <div class="form-group">
                        <label class="form-label">City *</label>
                        <input type="text" id="reg-city" class="form-control" placeholder="e.g. Mumbai, Pune" required>
                    </div>
                    <div class="form-group">
                        <label class="form-label">Password *</label>
                        <input type="password" id="reg-password" class="form-control" placeholder="Create password" required>
                    </div>
                </div>

                <div class="form-group" style="margin-bottom:20px;">
                    <label style="display:flex; align-items:center; gap:8px; font-size:0.82rem; cursor:pointer;">
                        <input type="checkbox" required checked>
                        <span>I agree to Dream Travelkar's terms and privacy policies.</span>
                    </label>
                </div>

                <button type="submit" class="btn btn-gold" style="width:100%; padding:13px;">
                    <i class="fa fa-user-plus"></i> Register Customer Account
                </button>
            </form>

            <div style="margin-top:24px; text-align:center; font-size:0.85rem; color:var(--color-muted); border-top:1px solid var(--color-border-light); padding-top:16px;">
                Already have an account? <a href="login.html" style="color:var(--color-ocean); font-weight:600;">Sign In here</a>
            </div>
        </div>
    </div>

    <div style="margin-top:20px; text-align:center; font-size:0.82rem; color:#64748b;">
        <a href="index.html" style="color:var(--color-navy);"><i class="fa fa-arrow-left"></i> Back to Dream Travelkar Home</a>
    </div>

    <script src="js/data.js"></script>
    <script src="js/storage.js"></script>
    <script src="js/i18n.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', function () {
            const form = document.getElementById('customer-register-form');
            if (form) {
                form.addEventListener('submit', function (e) {
                    e.preventDefault();
                    const name = document.getElementById('reg-name').value.trim();
                    const email = document.getElementById('reg-email').value.trim();
                    const phone = document.getElementById('reg-phone').value.trim();
                    const city = document.getElementById('reg-city').value.trim();

                    const newCustomer = StorageManager.saveCustomer({
                        name: name,
                        email: email,
                        phone: phone,
                        city: city,
                        totalBookings: 0,
                        totalSpent: 0,
                        status: "New Customer"
                    });

                    StorageManager.setCurrentUser({
                        id: newCustomer.id,
                        name: name,
                        email: email,
                        phone: phone,
                        city: city
                    });

                    StorageManager.showToast(`Account created successfully! Welcome, ${name}.`, 'success');
                    setTimeout(() => window.location.href = 'customer-dashboard.html', 800);
                });
            }
        });
    </script>
</body>
</html>
